name: 操作求助
description: 在练习过程中遇到问题时，提供可以复现的信息。
title: "[求助] "
labels: [question]
body:
  - type: input
    id: related
    attributes:
      label: 相关 Issue 或 PR
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、预期结果和实际结果
      description: 说明做到哪一步、原本希望看到什么，以及实际显示什么。粘贴信息前去掉私人资料。
    validations:
      required: true
